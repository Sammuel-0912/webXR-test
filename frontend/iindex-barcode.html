<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UPS AR 接線導引 — Barcode 版</title>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <script src="test.js"></script>
  <style>
    body { margin:0; overflow:hidden; font-family:sans-serif; }

    #hud {
      position:fixed; top:0; left:0; right:0;
      background:rgba(20,50,120,0.85);
      color:#fff; text-align:center;
      padding:10px 8px; font-size:14px; z-index:999;
      line-height:1.5;
    }

    #warning {
      display:none;
      position:fixed; bottom:72px; left:50%; transform:translateX(-50%);
      background:rgba(200,20,20,0.92);
      color:#fff; padding:11px 24px; border-radius:8px;
      font-size:15px; font-weight:bold; z-index:999;
      animation:blink 0.65s infinite alternate;
    }
    @keyframes blink { from{opacity:1} to{opacity:0.35} }

    #controls {
      position:fixed; bottom:0; left:0; right:0;
      display:flex; justify-content:center; gap:10px;
      padding:10px; background:rgba(0,0,0,0.6); z-index:999;
      flex-wrap:wrap;
    }
    #controls button {
      padding:8px 16px; border-radius:6px; border:none;
      font-size:13px; cursor:pointer; font-weight:bold;
    }
    .btn-ok   { background:#22cc66; color:#fff; }
    .btn-warn { background:#e63030; color:#fff; }
    .btn-reset{ background:#888;    color:#fff; }

    #legend {
      position:fixed; top:52px; right:8px;
      background:rgba(10,20,60,0.82);
      color:#cde; border-radius:8px;
      padding:8px 12px; font-size:12px; z-index:998;
      line-height:1.8;
    }
  </style>
</head>
<body>

  <div id="hud">📷 請將攝像頭對準 Barcode Marker<br>
    <span style="font-size:12px">ID 0 → 輸入端 ｜ ID 1 → 輸出端 ｜ ID 2 → 電池組</span>
  </div>

  <div id="warning" id="warn-msg">⚠️ 接線顏色錯誤！請檢查</div>

  <div id="legend">
    🔵 ID 0 — INPUT 輸入端<br>
    🟢 ID 1 — OUTPUT 輸出端<br>
    🟠 ID 2 — BATTERY 電池組
  </div>

  <div id="controls">
    <button class="btn-ok"   onclick="setStatus(0,'ok')">✅ ID0 正確</button>
    <button class="btn-warn" onclick="setStatus(0,'warn')">🔴 ID0 錯誤</button>
    <button class="btn-ok"   onclick="setStatus(1,'ok')">✅ ID1 正確</button>
    <button class="btn-warn" onclick="setStatus(1,'warn')">🔴 ID1 錯誤</button>
    <button class="btn-ok"   onclick="setStatus(2,'ok')">✅ ID2 正確</button>
    <button class="btn-warn" onclick="setStatus(2,'warn')">🔴 ID2 錯誤</button>
    <button class="btn-reset" onclick="resetAll()">重置全部</button>
  </div>

    embedded
