<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>AR 點檢</title>

  <!--
    A-Frame 1.3.0 + AR.js 3.4.5（jsdelivr 固定版本，雲端穩定）
    raw.githack.com/master 在雲端環境容易失效，請勿使用
  -->
  <script src="https://cdn.jsdelivr.net/npm/aframe@1.3.0/dist/aframe-master.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@ar-js-org/ar.js@3.4.5/aframe/build/aframe-ar.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #0d1117; overflow: hidden; color: #fff; }

    /* ── Top bar ── */
    #top-bar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 300;
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 16px;
      background: rgba(0,0,0,0.6); backdrop-filter: blur(6px);
    }
    .title { font-size: 16px; font-weight: 600; letter-spacing: 1px; }
    #back-btn {
      background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3);
      color: #fff; padding: 6px 14px; border-radius: 20px; font-size: 13px; cursor: pointer;
    }

    /* ══════════════════════════════════════════
       START SCREEN（裝置載入後顯示，等待使用者點擊才啟動相機）
       行動瀏覽器在 HTTPS 上必須有 user gesture 才能呼叫 getUserMedia
    ══════════════════════════════════════════ */
    #start-screen {
      position: fixed; inset: 0; z-index: 200;
      background: #0d1117;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 20px; padding: 32px;
      transition: opacity .3s;
    }
    #start-screen.hidden { opacity: 0; pointer-events: none; }

    .start-icon { font-size: 64px; }

    #start-device-list {
      background: #161b22; border: 1px solid #30363d; border-radius: 12px;
      padding: 14px 18px; width: 100%; max-width: 340px;
    }
    .sdl-title { font-size: 11px; color: #8b949e; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
    .sdl-item {
      display: flex; align-items: center; gap: 10px;
      padding: 6px 0; border-bottom: 1px solid #21262d; font-size: 14px;
    }
    .sdl-item:last-child { border-bottom: none; }
    .sdl-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

    #start-btn {
      width: 100%; max-width: 340px;
      padding: 18px;
      background: #22c55e; color: #fff;
      font-size: 18px; font-weight: 700; letter-spacing: 1px;
      border: none; border-radius: 16px; cursor: pointer;
      box-shadow: 0 4px 24px rgba(34,197,94,.4);
      transition: transform .12s, box-shadow .12s;
    }
    #start-btn:active { transform: scale(.97); }
    #start-btn:disabled { background: #374151; color: #6b7280; box-shadow: none; cursor: not-allowed; }
    #start-status { font-size: 13px; color: #8b949e; }

    /* ── Loading spinner（取得設備清單時顯示）── */
    #loading-overlay {
      position: fixed; inset: 0; z-index: 250;
      background: #0d1117;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
    }
    #loading-overlay.hidden { display: none; }
    .ld-spinner {
      width: 34px; height: 34px;
      border: 3px solid #30363d; border-top-color: #58a6ff;
      border-radius: 50%; animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading-msg { font-size: 14px; color: #8b949e; }

    /* ── AR 執行中 UI ── */
    #scan-hint {
      position: fixed; bottom: 130px; left: 50%; transform: translateX(-50%);
      z-index: 100; background: rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.2); border-radius: 12px;
      padding: 10px 20px; font-size: 14px; color: #ccc;
      pointer-events: none; transition: opacity .4s; white-space: nowrap;
      display: none;
    }
    #scan-hint.visible { display: block; }
    #scan-hint.qr-mode { color: #58a6ff; border-color: #58a6ff44; }

    #crosshair {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
      width: 180px; height: 180px; pointer-events: none; z-index: 50; display: none;
    }
    #crosshair.visible { display: block; }
    #crosshair svg { width: 100%; height: 100%; }

    /* ── Bottom sheet ── */
    #bottom-sheet {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 200;
      background: #1a1e2e; border-radius: 20px 20px 0 0;
      padding: 16px 20px 32px;
      transform: translateY(100%);
      transition: transform .35s cubic-bezier(.4,0,.2,1);
      box-shadow: 0 -4px 30px rgba(0,0,0,.6);
      max-height: 75vh; overflow-y: auto;
    }
    #bottom-sheet.open { transform: translateY(0); }
    #sheet-handle { width: 40px; height: 4px; background: #444; border-radius: 2px; margin: 0 auto 14px; }

    #device-label { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 1px; }
    #device-name  { font-size: 20px; font-weight: 700; margin: 2px 0 4px; }
    #device-desc  { font-size: 13px; color: #aaa; margin-bottom: 14px; }

    #instruction-wrap { display: none; }
    #instruction-wrap.visible { display: block; }
    #instruction-title { font-size: 11px; color: #58a6ff; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
    #instruction-text {
      background: #0d1117; border: 1px solid #30363d; border-radius: 8px;
      padding: 10px 12px; font-size: 13px; line-height: 1.6;
      white-space: pre-wrap; color: #c9d1d9; margin-bottom: 14px;
    }
    #device-image-wrap { display: none; text-align: center; margin-bottom: 14px; }
    #device-image-wrap.visible { display: block; }
    #device-image { max-width: 100%; max-height: 180px; border-radius: 8px; object-fit: cover; }

    .btn-row { display: flex; gap: 12px; margin-bottom: 14px; }
    .judge-btn {
      flex: 1; padding: 15px 0; font-size: 17px; font-weight: 700;
      border: none; border-radius: 14px; cursor: pointer; letter-spacing: 1px;
      transition: transform .12s;
    }
    .judge-btn:active { transform: scale(.96); }
    .btn-ok   { background: #22c55e; color: #fff; box-shadow: 0 4px 18px rgba(34,197,94,.35); }
    .btn-warn { background: #f59e0b; color: #fff; box-shadow: 0 4px 18px rgba(245,158,11,.35); }
    .judge-btn:disabled { opacity: .45; cursor: not-allowed; }

    #feedback {
      min-height: 36px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 600; opacity: 0; transition: opacity .3s;
    }
    #feedback.show { opacity: 1; }
    #feedback.success { background: rgba(34,197,94,.18); color: #4ade80; }
    #feedback.error   { background: rgba(239,68,68,.18);  color: #f87171; }

    /* ── QR mode banner ── */
    #qr-mode-banner {
      display: none; position: fixed; top: 52px; left: 0; right: 0; z-index: 100;
      background: rgba(88,166,255,.15); border-bottom: 1px solid rgba(88,166,255,.3);
      color: #58a6ff; text-align: center; padding: 7px; font-size: 13px;
    }
    #qr-mode-banner.visible { display: block; }

    #conn-error {
      display: none; position: fixed; top: 52px; left: 0; right: 0; z-index: 400;
      background: rgba(220,38,38,.9); color: #fff;
      padding: 10px 16px; font-size: 13px; text-align: center; line-height: 1.5;
    }
    #conn-error.visible { display: block; }
  </style>
</head>
<body>

<div id="top-bar">
  <span class="title">📡 AR 點檢系統</span>
  <button id="back-btn">← 儀表板</button>
</div>

<div id="qr-mode-banner">📱 QR Code 掃碼模式</div>
<div id="conn-error"></div>

<!-- 1. 載入中（取得設備時） -->
<div id="loading-overlay">
  <div class="ld-spinner"></div>
  <div id="loading-msg">正在載入設備清單…</div>
</div>

<!-- 2. Start Screen（設備載入後顯示，等待使用者點擊才啟動相機）-->
<div id="start-screen" class="hidden">
  <div class="start-icon">📡</div>
  <div id="start-device-list">
    <div class="sdl-title">已載入設備</div>
    <div id="sdl-items"></div>
  </div>
  <button id="start-btn" onclick="startAR()">▶ 開始 AR 掃描</button>
  <div id="start-status">點擊後瀏覽器會請求相機權限</div>
</div>

<!-- 3. AR 執行中 UI（start-screen 後才顯示） -->
<div id="crosshair">
  <svg viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M10 50 L10 10 L50 10"       stroke="white" stroke-width="3" stroke-linecap="round"/>
    <path d="M130 10 L170 10 L170 50"    stroke="white" stroke-width="3" stroke-linecap="round"/>
    <path d="M10 130 L10 170 L50 170"    stroke="white" stroke-width="3" stroke-linecap="round"/>
    <path d="M130 170 L170 170 L170 130" stroke="white" stroke-width="3" stroke-linecap="round"/>
  </svg>
</div>

<div id="scan-hint">將鏡頭對準設備上的 AR Marker</div>

<div id="bottom-sheet">
  <div id="sheet-handle"></div>
  <div id="device-label">偵測設備</div>
  <div id="device-name">—</div>
  <div id="device-desc">—</div>
  <div id="device-image-wrap"><img id="device-image" src="" alt="作業指引圖" /></div>
  <div id="instruction-wrap">
    <div id="instruction-title">📋 作業指引</div>
    <div id="instruction-text"></div>
  </div>
  <div class="btn-row">
    <button class="judge-btn btn-ok"   id="btn-ok"   onclick="submitInspection('ok')">✔ 正常 OK</button>
    <button class="judge-btn btn-warn" id="btn-warn" onclick="submitInspection('warn')">⚠ 異常 WARN</button>
  </div>
  <div id="feedback"></div>
</div>

<!--
  A-Frame scene 不寫在 HTML 裡，改由 startAR() 動態建立並插入
  原因：行動瀏覽器 HTTPS 環境需要 user gesture 才能呼叫 getUserMedia
        若在頁面載入時就建立 scene，瀏覽器會拒絕相機存取
-->


</body>
</html>
