<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>AR 點檢</title>

  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #000; overflow: hidden; color: #fff; }

    /* ── Top bar ── */
    #top-bar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 16px;
      background: rgba(0,0,0,0.55); backdrop-filter: blur(6px);
    }
    #top-bar .title { font-size: 16px; font-weight: 600; letter-spacing: 1px; }
    #back-btn {
      background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3);
      color: #fff; padding: 6px 14px; border-radius: 20px; font-size: 13px;
      cursor: pointer;
    }

    /* ── Loading overlay ── */
    #loading-overlay {
      position: fixed; inset: 0; z-index: 300;
      background: #0d1117;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
    }
    #loading-overlay.hidden { display: none; }
    .ld-spinner {
      width: 36px; height: 36px;
      border: 3px solid #30363d; border-top-color: #58a6ff;
      border-radius: 50%; animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading-msg { font-size: 15px; color: #8b949e; }
    #device-count { font-size: 12px; color: #555; margin-top: 4px; }

    /* ── Scan hint ── */
    #scan-hint {
      position: fixed; bottom: 130px; left: 50%; transform: translateX(-50%);
      z-index: 100; background: rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.2); border-radius: 12px;
      padding: 10px 20px; font-size: 14px; color: #ccc;
      pointer-events: none; transition: opacity .4s; white-space: nowrap;
    }
    #scan-hint.qr-mode { color: #58a6ff; border-color: #58a6ff44; }

    /* ── Crosshair ── */
    #crosshair {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
      width: 180px; height: 180px; pointer-events: none; z-index: 50;
    }
    #crosshair svg { width: 100%; height: 100%; }

    /* ── Bottom sheet ── */
    #bottom-sheet {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 200;
      background: #1a1e2e; border-radius: 20px 20px 0 0;
      padding: 16px 20px 32px;
      transform: translateY(100%);
      transition: transform .35s cubic-bezier(.4,0,.2,1);
      box-shadow: 0 -4px 30px rgba(0,0,0,.6);
      max-height: 75vh; overflow-y: auto;
    }
    #bottom-sheet.open { transform: translateY(0); }
    #sheet-handle { width: 40px; height: 4px; background: #444; border-radius: 2px; margin: 0 auto 14px; }

    #device-label { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 1px; }
    #device-name  { font-size: 20px; font-weight: 700; margin: 2px 0 4px; }
    #device-desc  { font-size: 13px; color: #aaa; margin-bottom: 14px; }

    #instruction-wrap { display: none; }
    #instruction-wrap.visible { display: block; }
    #instruction-title { font-size: 11px; color: #58a6ff; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
    #instruction-text {
      background: #0d1117; border: 1px solid #30363d; border-radius: 8px;
      padding: 10px 12px; font-size: 13px; line-height: 1.6;
      white-space: pre-wrap; color: #c9d1d9; margin-bottom: 14px;
    }
    #device-image-wrap { display: none; text-align: center; margin-bottom: 14px; }
    #device-image-wrap.visible { display: block; }
    #device-image { max-width: 100%; max-height: 180px; border-radius: 8px; object-fit: cover; }

    .btn-row { display: flex; gap: 12px; margin-bottom: 14px; }
    .judge-btn {
      flex: 1; padding: 15px 0; font-size: 17px; font-weight: 700;
      border: none; border-radius: 14px; cursor: pointer; letter-spacing: 1px;
      transition: transform .12s;
    }
    .judge-btn:active { transform: scale(.96); }
    .btn-ok   { background: #22c55e; color: #fff; box-shadow: 0 4px 18px rgba(34,197,94,.35); }
    .btn-warn { background: #f59e0b; color: #fff; box-shadow: 0 4px 18px rgba(245,158,11,.35); }
    .judge-btn:disabled { opacity: .45; cursor: not-allowed; }

    #feedback {
      min-height: 36px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 600; opacity: 0; transition: opacity .3s;
    }
    #feedback.show { opacity: 1; }
    #feedback.success { background: rgba(34,197,94,.18); color: #4ade80; }
    #feedback.error   { background: rgba(239,68,68,.18);  color: #f87171; }

    #conn-error {
      display: none; position: fixed; top: 56px; left: 0; right: 0; z-index: 150;
      background: rgba(220,38,38,.9); color: #fff;
      padding: 10px 16px; font-size: 13px; text-align: center; line-height: 1.5;
    }
    #conn-error.visible { display: block; }

    #qr-mode-banner {
      display: none; position: fixed; top: 52px; left: 0; right: 0; z-index: 100;
      background: rgba(88,166,255,.15); border-bottom: 1px solid rgba(88,166,255,.3);
      color: #58a6ff; text-align: center; padding: 7px; font-size: 13px;
    }
    #qr-mode-banner.visible { display: block; }
  </style>
</head>
<body>

<div id="top-bar">
  <span class="title">📡 AR 點檢系統</span>
  <button id="back-btn">← 儀表板</button>
</div>

<div id="qr-mode-banner">📱 QR Code 掃碼模式 — 設備資訊已自動帶入</div>
<div id="conn-error"></div>

<!-- 載入中 overlay：等待後端回傳設備清單 -->
<div id="loading-overlay">
  <div class="ld-spinner"></div>
  <div id="loading-msg">正在載入設備清單…</div>
  <div id="device-count"></div>
</div>

<div id="crosshair">
  <svg viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M10 50 L10 10 L50 10"       stroke="white" stroke-width="3" stroke-linecap="round"/>
    <path d="M130 10 L170 10 L170 50"    stroke="white" stroke-width="3" stroke-linecap="round"/>
    <path d="M10 130 L10 170 L50 170"    stroke="white" stroke-width="3" stroke-linecap="round"/>
    <path d="M130 170 L170 170 L170 130" stroke="white" stroke-width="3" stroke-linecap="round"/>
  </svg>
</div>

<div id="scan-hint">將鏡頭對準設備上的 AR Marker</div>

<div id="bottom-sheet">
  <div id="sheet-handle"></div>
  <div id="device-label">偵測設備</div>
  <div id="device-name">—</div>
  <div id="device-desc">—</div>
  <div id="device-image-wrap"><img id="device-image" src="" alt="作業指引圖" /></div>
  <div id="instruction-wrap">
    <div id="instruction-title">📋 作業指引</div>
    <div id="instruction-text"></div>
  </div>
  <div class="btn-row">
    <button class="judge-btn btn-ok"   id="btn-ok"   onclick="submitInspection('ok')">✔ 正常 OK</button>
    <button class="judge-btn btn-warn" id="btn-warn" onclick="submitInspection('warn')">⚠ 異常 WARN</button>
  </div>
  <div id="feedback"></div>
</div>

<!--
  A-Frame scene：不寫任何 <a-marker>
  全部由 JS 在取得設備清單後動態建立
-->
<a-scene id="ar-scene"
  embedded
  arjs="sourceType:webcam; detectionMode:mono_and_matrix; matrixCodeType:3x3; debugUIEnabled:false;"
  vr-mode-ui="enabled:false"
  renderer="logarithmicDepthBuffer:true; precision:medium;"
  style="position:fixed;top:0;left:0;width:100%;height:100%;z-index:1;">
  <a-entity camera></a-entity>
</a-scene>

<script>
// ── URL 參數 ──────────────────────────────────────────────────────
const _p      = new URLSearchParams(window.location.search)
const BACKEND = (_p.get('backend') || '__VITE_BACKEND_URL__').replace(/\/$/, '')
const urlMarkerId = _p.get('marker_id')
const qrMode      = urlMarkerId !== null

// Back 按鈕
document.getElementById('back-btn').onclick = () => { window.location.href = '/dashboard' }

// ── 狀態 ──────────────────────────────────────────────────────────
let currentMarkerId = null
let deviceCache     = {}   // marker_id → device 物件
let submitting      = false

// ── Marker 顏色池（依 marker_id 輪替）────────────────────────────
const MARKER_COLORS = [
  '#22c55e','#3b82f6','#f59e0b','#a855f7',
  '#ef4444','#06b6d4','#84cc16','#f97316',
  '#ec4899','#14b8a6','#eab308','#8b5cf6',
]

// ── 動態建立 <a-marker> ───────────────────────────────────────────
function buildMarkers(devices) {
  const scene = document.getElementById('ar-scene')
  const camera = scene.querySelector('[camera]')   // 保留 camera entity

  devices.forEach(dev => {
    const color = MARKER_COLORS[dev.marker_id % MARKER_COLORS.length]

    // <a-marker type="barcode" value="N">
    const marker = document.createElement('a-marker')
    marker.setAttribute('type', 'barcode')
    marker.setAttribute('value', String(dev.marker_id))
    marker.id = `marker-${dev.marker_id}`

    // 底座色塊
    const box = document.createElement('a-box')
    box.setAttribute('position', '0 0.05 0')
    box.setAttribute('scale', '0.4 0.04 0.4')
    box.setAttribute('color', color)
    box.setAttribute('opacity', '0.85')
    marker.appendChild(box)

    // 作業指引圖片（若有設定）
    if (dev.image_url) {
      const img = document.createElement('a-image')
      img.setAttribute('position', '0 0.6 0')
      img.setAttribute('scale', '0.9 0.65 1')
      img.setAttribute('src', BACKEND + dev.image_url)
      img.setAttribute('look-at', '[camera]')
      marker.appendChild(img)
    }

    // 設備名稱文字
    const txt = document.createElement('a-text')
    txt.setAttribute('value', dev.name)
    txt.setAttribute('position', '0 1.3 0')
    txt.setAttribute('scale', '0.45 0.45 0.45')
    txt.setAttribute('color', 'white')
    txt.setAttribute('align', 'center')
    marker.appendChild(txt)

    // 事件
    const id = dev.marker_id
    marker.addEventListener('markerFound', () => onMarkerFound(id))
    marker.addEventListener('markerLost',  () => onMarkerLost())

    // 插入 scene（放在 camera entity 之前）
    scene.insertBefore(marker, camera)
  })
}

// ── 載入設備清單 ──────────────────────────────────────────────────
async function loadDevices() {
  setLoadingMsg('正在連線後端…')
  try {
    const res = await fetch(BACKEND + '/devices', { signal: AbortSignal.timeout(8000) })
    if (!res.ok) throw new Error('HTTP ' + res.status)
    const devices = await res.json()

    // 建立快取
    devices.forEach(d => { deviceCache[d.marker_id] = d })

    // 等 A-Frame scene 初始化完畢再注入 marker
    const scene = document.getElementById('ar-scene')
    setLoadingMsg(`載入完成，共 ${devices.length} 台設備，初始化 AR…`)
    document.getElementById('device-count').textContent =
      devices.map(d => `Marker ${d.marker_id}: ${d.name}`).join('　')

    const inject = () => {
      buildMarkers(devices)
      hideLoading()
      if (qrMode) onMarkerFound(Number(urlMarkerId))
    }

    if (scene.hasLoaded) { inject() }
    else { scene.addEventListener('loaded', inject, { once: true }) }

    hideConnError()
  } catch (e) {
    setLoadingMsg('無法連線至後端')
    document.getElementById('device-count').textContent =
      `(${BACKEND}) — 請確認後端已啟動且在同一網路`
    showConnError('⚠ 後端連線失敗 (' + BACKEND + ')，請檢查服務狀態後重新整理頁面')
    hideLoading(2000)   // 2 秒後關閉 loading，讓使用者看到錯誤
    if (qrMode) setTimeout(() => onMarkerFound(Number(urlMarkerId)), 2000)
  }
}

loadDevices()

// ── Marker 事件 ───────────────────────────────────────────────────
function onMarkerFound(markerId) {
  if (currentMarkerId === markerId) return
  currentMarkerId = markerId

  const dev = deviceCache[markerId]
  document.getElementById('device-name').textContent = dev ? dev.name : 'Marker ' + markerId
  document.getElementById('device-desc').textContent = dev ? (dev.description || '') : ''

  const iWrap = document.getElementById('instruction-wrap')
  if (dev && dev.work_instruction) {
    document.getElementById('instruction-text').textContent = dev.work_instruction
    iWrap.classList.add('visible')
  } else { iWrap.classList.remove('visible') }

  const imgWrap = document.getElementById('device-image-wrap')
  if (dev && dev.image_url) {
    document.getElementById('device-image').src = BACKEND + dev.image_url
    imgWrap.classList.add('visible')
  } else { imgWrap.classList.remove('visible') }

  clearFeedback()
  setButtonsDisabled(false)
  openSheet()
  hideScanHint()
}

function onMarkerLost() {
  if (qrMode) return
  setTimeout(() => {
    if (currentMarkerId !== null) {
      currentMarkerId = null; closeSheet(); showScanHint()
    }
  }, 2500)
}

// ── 送出點檢 ─────────────────────────────────────────────────────
async function submitInspection(status) {
  if (submitting || currentMarkerId === null) return
  submitting = true; setButtonsDisabled(true)
  try {
    const res = await fetch(BACKEND + '/update', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ marker_id: currentMarkerId, status }),
      signal: AbortSignal.timeout(8000),
    })
    if (res.ok) {
      showFeedback('success', status === 'ok' ? '✔ 已記錄：正常 OK' : '⚠ 已記錄：異常 WARN')
      if (!qrMode) {
        setTimeout(() => { closeSheet(); showScanHint(); currentMarkerId = null }, 1800)
      } else {
        setTimeout(() => { clearFeedback(); setButtonsDisabled(false) }, 1800)
      }
    } else {
      const b = await res.json().catch(() => ({}))
      showFeedback('error', '上傳失敗：' + (b.detail || res.status))
      setButtonsDisabled(false)
    }
  } catch (e) {
    showFeedback('error', e.name === 'TimeoutError' ? '請求逾時' : '網路錯誤')
    setButtonsDisabled(false)
  } finally { submitting = false }
}

// ── UI helpers ───────────────────────────────────────────────────
function openSheet()  { document.getElementById('bottom-sheet').classList.add('open')    }
function closeSheet() { document.getElementById('bottom-sheet').classList.remove('open') }
function showScanHint() { document.getElementById('scan-hint').style.opacity = '1' }
function hideScanHint() { document.getElementById('scan-hint').style.opacity = '0' }
function setButtonsDisabled(d) {
  document.getElementById('btn-ok').disabled = d
  document.getElementById('btn-warn').disabled = d
}
function showFeedback(type, msg) {
  const el = document.getElementById('feedback'); el.className = 'show ' + type; el.textContent = msg
}
function clearFeedback() {
  const el = document.getElementById('feedback'); el.className = ''; el.textContent = ''
}
function showConnError(msg) {
  const el = document.getElementById('conn-error'); el.textContent = msg; el.classList.add('visible')
}
function hideConnError() { document.getElementById('conn-error').classList.remove('visible') }
function setLoadingMsg(msg) { document.getElementById('loading-msg').textContent = msg }
function hideLoading(delay = 0) {
  setTimeout(() => document.getElementById('loading-overlay').classList.add('hidden'), delay)
}

// QR mode UI
if (qrMode) {
  document.getElementById('qr-mode-banner').classList.add('visible')
  document.getElementById('scan-hint').classList.add('qr-mode')
  document.getElementById('scan-hint').textContent = '📱 QR Code 模式 — 直接點選 OK / WARN 完成點檢'
  document.getElementById('crosshair').style.display = 'none'
}
</script>
</body>
</html>
